<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ふたり家計簿</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f6f5f0;
      --card-bg: #ffffff;
      --green-main: #3b7e5b;
      --orange-tag: #e08b47;
      --blue-tag: #6fa2b8;
      --text-dark: #333333;
      --text-muted: #888888;
      --border-radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 16px;
      padding-bottom: 220px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    /* ヘッダー */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px 16px;
      font-weight: bold;
    }
    .header-title { display: flex; align-items: center; gap: 6px; font-size: 18px; }
    .header-title span { color: var(--green-main); }
    .month-selector { display: flex; align-items: center; gap: 8px; font-size: 16px; }
    .month-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #666; padding: 0 4px; }

    /* サマリーカード */
    .summary-card {
      background-color: var(--green-main);
      color: white;
      border-radius: var(--border-radius);
      padding: 20px;
      margin-bottom: 16px;
    }
    .summary-title { font-size: 14px; opacity: 0.9; }
    .summary-amount { font-size: 30px; font-weight: bold; margin: 6px 0 12px; }
    
    .badge-group { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .badge { background: rgba(255, 255, 255, 0.2); padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .badge-orange { background: var(--orange-tag); }
    .badge-blue { background: var(--blue-tag); }

    .split-info {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.4;
    }

    /* カード */
    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .card-title { font-size: 14px; color: var(--text-muted); font-weight: bold; margin-bottom: 12px; }
    .empty-msg { font-size: 13px; color: #777; line-height: 1.5; }

    /* 履歴リスト */
    .record-list { list-style: none; }
    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .record-item:last-child { border-bottom: none; }
    .record-main { display: flex; flex-direction: column; gap: 2px; }
    .record-category { font-size: 11px; background: #eee; padding: 2px 6px; border-radius: 4px; display: inline-block; width: fit-content; }
    .record-memo { font-size: 14px; font-weight: 500; }
    .record-sub { font-size: 11px; color: var(--text-muted); }
    .record-right { text-align: right; display: flex; align-items: center; gap: 8px; }
    .record-amount { font-size: 15px; font-weight: bold; }
    .amount-income { color: #2e7d32; }
    .amount-expense { color: #d32f2f; }
    .delete-btn {
      border: none;
      background: #ffebee;
      color: #c62828;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }

    /* 入力フォーム（固定バー・自動リサイズ修正版） */
    .input-bar-container {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 456px;
      background: white;
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
      width: 100%;
      flex-wrap: wrap;
    }
    
    select, input[type="text"], input[type="number"], input[type="date"] {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      outline: none;
      min-width: 0; /* Flexboxでの幅はみ出し防止 */
    }

    .input-date { flex: 2; min-width: 110px; }
    .select-small { flex: 1.5; min-width: 100px; background: #f9f9f9; }
    .input-memo { flex: 2; min-width: 110px; }
    .input-amount { flex: 1.5; min-width: 80px; font-weight: bold; }

    .toggle-btn {
      border: none;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }
    .btn-type { background: #f0f0f0; color: #333; }
    .btn-user-me { background: var(--orange-tag); color: white; }
    .btn-user-partner { background: var(--blue-tag); color: white; }

    .add-btn {
      background: var(--green-main);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      height: 36px;
      flex-shrink: 0;
    }

    .camera-btn {
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 10px;
      font-size: 12px;
      cursor: pointer;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* レシート モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 90%;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; }
    .receipt-item-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .modal-btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    .btn-cancel { background: #eee; }
    .btn-save { background: var(--green-main); color: white; }

    /* ナビゲーションバー */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #eaeaea;
      z-index: 5;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--text-muted); text-decoration: none; cursor: pointer; }
    .nav-item.active { color: var(--green-main); font-weight: bold; }
    .nav-icon { font-size: 18px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-title"><span>◆</span> ふたり家計簿</div>
    <div class="month-selector">
      <button class="month-btn" onclick="changeMonth(-1)">‹</button>
      <span id="currentMonthText">----年--月</span>
      <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <!-- 収支サマリー -->
  <div class="summary-card">
    <div class="summary-title" id="summaryMonthTitle">今月の収支</div>
    <div class="summary-amount" id="totalBalance">¥0</div>
    <div class="badge-group">
      <div class="badge" id="totalIncome">収入 ¥0</div>
      <div class="badge" id="totalExpense">支出 ¥0</div>
    </div>
    <div class="badge-group">
      <div class="badge badge-orange" id="myExpense">ゆうきの支出 ¥0</div>
      <div class="badge badge-blue" id="partnerExpense">れなの支出 ¥0</div>
    </div>
    <div class="split-info" id="splitResult">精算計算中...</div>
  </div>

  <!-- 支出内訳グラフ -->
  <div class="card">
    <div class="card-title">カテゴリ別支出グラフ</div>
    <canvas id="categoryChart" style="max-height: 220px;"></canvas>
  </div>

  <!-- 最近の記録 -->
  <div class="card">
    <div class="card-title">最近の記録</div>
    <div id="statusMessage" class="empty-msg"></div>
    <ul id="dataList" class="record-list"></ul>
  </div>

  <!-- 入力フォーム -->
  <div class="input-bar-container">
    <div class="input-row">
      <button class="toggle-btn btn-type" id="btnType" onclick="toggleType()">支出</button>
      <button class="toggle-btn btn-user-me" id="btnUser" onclick="toggleUser()">ゆうき</button>
      <input type="date" id="inputDate" class="input-date">
      <label class="camera-btn">
        📷 撮影
        <input type="file" id="receiptFileInput" accept="image/*" capture="environment" style="display:none;" onchange="handleReceiptUpload(event)">
      </label>
    </div>
    <div class="input-row">
      <select id="selectCategory" class="select-small">
        <option value="食料品">食料品</option>
        <option value="日用品">日用品</option>
        <option value="家賃">家賃 (ゆうき6:れな4)</option>
        <option value="光熱費・住居">光熱費・住居</option>
        <option value="外食・カフェ">外食・カフェ</option>
        <option value="消耗品">消耗品</option>
        <option value="サブスク・通信">サブスク・通信</option>
        <option value="交通費">交通費</option>
        <option value="娯楽・イベント">娯楽・イベント</option>
        <option value="個人利用">個人利用 (折半なし)</option>
        <option value="その他">その他</option>
      </select>
      <input type="text" id="inputMemo" class="input-memo" placeholder="メモ">
      <input type="number" id="inputAmount" class="input-amount" placeholder="金額">
      <button class="add-btn" onclick="addData()">＋</button>
    </div>
  </div>

  <!-- レシート読み取り確認モーダル -->
  <div class="modal-overlay" id="receiptModal">
    <div class="modal-content">
      <div class="modal-title">レシート項目の確認・カテゴリ振り分け</div>
      <div id="receiptItemsContainer"></div>
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" onclick="closeReceiptModal()">キャンセル</button>
        <button class="modal-btn btn-save" onclick="saveReceiptItems()">一括追加</button>
      </div>
    </div>
  </div>

  <!-- 下部ナビゲーション -->
  <div class="nav-bar">
    <div class="nav-item active"><span class="nav-icon">🏠</span>ホーム</div>
    <div class="nav-item"><span class="nav-icon">📊</span>グラフ</div>
    <div class="nav-item"><span class="nav-icon">📋</span>履歴</div>
    <div class="nav-item"><span class="nav-icon">⚙</span>設定</div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwigyRtuHJCX-rCMe-LGLQ6E21A-yrwwxYNOO9ukdR24c9VJHFawPiaOutZi1p8xgyJ/exec";

    let currentDate = new Date();
    let currentType = "支出";
    let currentUser = "ゆうき";
    let allData = [];
    let myChart = null;

    const categoryOptions = [
      "食料品", "日用品", "外食・カフェ", "光熱費・住居",
      "消耗品", "サブスク・通信", "交通費", "娯楽・イベント",
      "個人利用", "家賃", "その他"
    ];

    window.onload = () => {
      document.getElementById("inputDate").valueAsDate = new Date();
      updateMonthDisplay();
      loadData();
    };

    function updateMonthDisplay() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      document.getElementById("currentMonthText").textContent = `${year}年${month}月`;
      document.getElementById("summaryMonthTitle").textContent = `${month}月の収支`;
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      updateMonthDisplay();
      renderUI();
    }

    function toggleType() {
      currentType = currentType === "支出" ? "収入" : "支出";
      const btn = document.getElementById("btnType");
      btn.textContent = currentType;
      btn.style.background = currentType === "収入" ? "#e8f5e9" : "#f0f0f0";
    }

    function toggleUser() {
      currentUser = currentUser === "ゆうき" ? "れな" : "ゆうき";
      const btn = document.getElementById("btnUser");
      btn.textContent = currentUser;
      btn.className = `toggle-btn ${currentUser === "ゆうき" ? "btn-user-me" : "btn-user-partner"}`;
    }

    async function loadData() {
      const statusElement = document.getElementById("statusMessage");
      statusElement.textContent = "読み込み中...";

      try {
        const res = await fetch(GAS_URL);
        allData = await res.json();
        statusElement.textContent = "";
        renderUI();
      } catch (err) {
        statusElement.textContent = "データの取得に失敗しました。";
        console.error(err);
      }
    }

    function renderUI() {
      const listElement = document.getElementById("dataList");
      const statusElement = document.getElementById("statusMessage");
      listElement.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const filtered = allData.filter(item => {
        if (!item.date) return false;
        const d = new Date(item.date);
        return d.getFullYear() === year && d.getMonth() === month;
      });

      if (filtered.length === 0) {
        statusElement.textContent = "この月の記録はありません";
      } else {
        statusElement.textContent = "";
      }

      let incTotal = 0, expTotal = 0;
      let myTotalExp = 0, partnerTotalExp = 0;

      let yukiSharedTarget = 0;
      let renaSharedTarget = 0;
      let yukiPaidShared = 0;
      let renaPaidShared = 0;

      let categoryTotals = {};

      filtered.reverse().forEach(item => {
        const amt = Number(item.amount) || 0;
        const isExp = item.type === "支出";
        const cat = item.category || "未分類";

        if (isExp) {
          expTotal += amt;
          categoryTotals[cat] = (categoryTotals[cat] || 0) + amt;

          if (item.user === "れな") {
            partnerTotalExp += amt;
          } else {
            myTotalExp += amt;
          }

          if (cat === "個人利用") {
            // 個人利用は折半対象外
          } else if (cat === "家賃") {
            yukiSharedTarget += amt * 0.6;
            renaSharedTarget += amt * 0.4;
            if (item.user === "れな") renaPaidShared += amt;
            else yukiPaidShared += amt;
          } else {
            yukiSharedTarget += amt * 0.5;
            renaSharedTarget += amt * 0.5;
            if (item.user === "れな") renaPaidShared += amt;
            else yukiPaidShared += amt;
          }
        } else {
          incTotal += amt;
        }

        const li = document.createElement("li");
        li.className = "record-item";
        li.innerHTML = `
          <div class="record-main">
            <div><span class="record-category">${cat}</span></div>
            <div class="record-memo">${item.memo || item.type}</div>
            <div class="record-sub">${item.date} (${item.user})</div>
          </div>
          <div class="record-right">
            <span class="record-amount ${isExp ? 'amount-expense' : 'amount-income'}">
              ${isExp ? '-' : '+'}¥${amt.toLocaleString()}
            </span>
            <button class="delete-btn" onclick="deleteData(${item.rowIndex})">削除</button>
          </div>
        `;
        listElement.appendChild(li);
      });

      document.getElementById("totalBalance").textContent = `¥${(incTotal - expTotal).toLocaleString()}`;
      document.getElementById("totalIncome").textContent = `収入 ¥${incTotal.toLocaleString()}`;
      document.getElementById("totalExpense").textContent = `支出 ¥${expTotal.toLocaleString()}`;
      document.getElementById("myExpense").textContent = `ゆうきの支出 ¥${myTotalExp.toLocaleString()}`;
      document.getElementById("partnerExpense").textContent = `れなの支出 ¥${partnerTotalExp.toLocaleString()}`;

      const yukiDiff = yukiPaidShared - yukiSharedTarget;
      const splitElem = document.getElementById("splitResult");

      if (Math.abs(yukiDiff) < 1) {
        splitElem.innerHTML = "精算結果: 精算の必要はありません";
      } else if (yukiDiff > 0) {
        splitElem.innerHTML = `精算結果 (共有分)<br>れな ➔ ゆうき: <b>¥${Math.round(yukiDiff).toLocaleString()}</b> 支払い`;
      } else {
        splitElem.innerHTML = `精算結果 (共有分)<br>ゆうき ➔ れな: <b>¥${Math.round(Math.abs(yukiDiff)).toLocaleString()}</b> 支払い`;
      }

      renderChart(categoryTotals);
    }

    function renderChart(categoryTotals) {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      const labels = Object.keys(categoryTotals);
      const data = Object.values(categoryTotals);

      if (myChart) myChart.destroy();
      if (labels.length === 0) return;

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: ['#3b7e5b', '#e08b47', '#6fa2b8', '#f39c12', '#9b59b6', '#e74c3c', '#34495e', '#1abc9c', '#d35400']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
        }
      });
    }

    async function addData() {
      const memo = document.getElementById("inputMemo").value.trim();
      const amount = document.getElementById("inputAmount").value;
      const date = document.getElementById("inputDate").value;
      const category = document.getElementById("selectCategory").value;

      if (!amount) { alert("金額を入力してください"); return; }

      const payload = {
        action: "add",
        date: date,
        type: currentType,
        user: currentUser,
        category: category,
        memo: memo,
        amount: amount
      };

      document.getElementById("statusMessage").textContent = "送信中...";
      document.getElementById("inputMemo").value = "";
      document.getElementById("inputAmount").value = "";

      try {
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
        await loadData();
      } catch (err) {
        alert("送信に失敗しました");
      }
    }

    /* レシート読み取り処理 */
    async function handleReceiptUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById("statusMessage").textContent = "レシート解析中...";

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Data = e.target.result.split(',')[1];
        try {
          const res = await fetch(GAS_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "analyzeReceipt",
              imageData: base64Data,
              mimeType: file.type
            })
          });
          const result = await res.json();
          document.getElementById("statusMessage").textContent = "";

          if (result.items && result.items.length > 0) {
            showReceiptModal(result.items);
          } else {
            alert("項目が読み取れませんでした。手動で入力してください。");
          }
        } catch (err) {
          alert("解析に失敗しました。");
          document.getElementById("statusMessage").textContent = "";
        }
      };
      reader.readAsDataURL(file);
    }

    function showReceiptModal(items) {
      const container = document.getElementById("receiptItemsContainer");
      container.innerHTML = "";

      items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "receipt-item-row";

        let catOptionsHtml = categoryOptions.map(c => `<option value="${c}">${c}</option>`).join('');

        row.innerHTML = `
          <input type="text" class="r-memo" value="${item.memo}" style="flex: 2; min-width: 100px;">
          <input type="number" class="r-amount" value="${item.amount}" style="flex: 1.2; min-width: 70px; font-weight:bold;">
          <select class="r-category" style="flex: 1.5; min-width: 90px;">${catOptionsHtml}</select>
        `;
        container.appendChild(row);
      });

      document.getElementById("receiptModal").style.display = "flex";
    }

    function closeReceiptModal() {
      document.getElementById("receiptModal").style.display = "none";
    }

    async function saveReceiptItems() {
      const rows = document.querySelectorAll(".receipt-item-row");
      const date = document.getElementById("inputDate").value;
      let records = [];

      rows.forEach(row => {
        const memo = row.querySelector(".r-memo").value;
        const amount = row.querySelector(".r-amount").value;
        const category = row.querySelector(".r-category").value;

        if (amount) {
          records.push({
            date: date,
            type: "支出",
            user: currentUser,
            category: category,
            memo: memo,
            amount: amount
          });
        }
      });

      if (records.length === 0) return;

      closeReceiptModal();
      document.getElementById("statusMessage").textContent = "一括登録中...";

      try {
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "add", records: records })
        });
        await loadData();
      } catch (err) {
        alert("登録に失敗しました");
      }
    }

    /* 完全削除処理 */
    async function deleteData(rowIndex) {
      if (!confirm("この記録をスプレッドシートから完全に削除しますか？")) return;

      document.getElementById("statusMessage").textContent = "削除中...";

      try {
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "delete", rowIndex: rowIndex })
        });
        await loadData();
      } catch (err) {
        alert("削除に失敗しました");
      }
    }
  </script>
</body>
</html>
